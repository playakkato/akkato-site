<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131B21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Akkato">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Akkato</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: one centered column. Header scores, a goal strip, the board (with win/lose overlay), combo meter, tool buttons, then a settings drawer. */
[hidden]{display:none!important}
:root{
  --bg:#E9EFF2; --fg:#1E2A33; --muted:#5B6B76; --board:#D6E0E6; --panel:#F7FAFB; --line:#C2CFD7; --accent:#E8735A; --track:#C9D5DC;
  --t-swap:#2F86CF; --t-paint:#E0691F; --t-rewind:#2BA58F; --t-clear:#C2417A;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131B21; --fg:#E6EEF2; --muted:#8FA1AD; --board:#1C2830; --panel:#1A242B; --line:#2A3841; --track:#2A3841; --t-swap:#6DB2EC; --t-paint:#F29A57; --t-rewind:#5CCBB5; --t-clear:#E87FAE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131B21; --fg:#E6EEF2; --muted:#8FA1AD; --board:#1C2830; --panel:#1A242B; --line:#2A3841; --track:#2A3841; --t-swap:#6DB2EC; --t-paint:#F29A57; --t-rewind:#5CCBB5; --t-clear:#E87FAE; color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px;
  padding-inline:16px; padding-block:14px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
.col{width:100%; max-width:480px; display:flex; flex-direction:column; gap:12px; min-width:0}
header{display:flex; justify-content:space-between; align-items:flex-end; gap:12px}
h1{font-family:var(--display); font-weight:600; font-size:1.7rem; line-height:1; margin:0; letter-spacing:.01em}
.scores{display:flex; gap:18px}
.stat{display:flex; flex-direction:column; align-items:flex-end}
.stat span{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.stat b{font-family:var(--display); font-weight:500; font-size:1.5rem; line-height:1.1; font-variant-numeric:tabular-nums}

.modes{display:flex; gap:6px; flex-wrap:wrap}
.modes button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}

.status{display:flex; gap:10px; align-items:stretch}
.goalbox{flex:1 1 auto; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 12px; display:flex; flex-direction:column; gap:6px; justify-content:center}
.goaltext{font-weight:700; font-size:.88rem; overflow-wrap:anywhere}
.goaltext .sw{font-size:1.05em; margin-inline:2px}
.track{height:8px; border-radius:99px; background:var(--track); overflow:hidden}
.track i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .35s ease, background .3s}
.track.low i{background:#E0783C}
.chip{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:62px}
.chip span{font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.chip b{font-family:var(--display); font-weight:500; font-size:1.3rem; line-height:1.1; font-variant-numeric:tabular-nums}

#wrap{width:100%; display:flex; justify-content:center; position:relative}
#stage{position:relative; line-height:0}
#flash{position:absolute; inset:0; border-radius:18px; pointer-events:none; opacity:0}
@keyframes akShake{0%{transform:translate(0,0)}15%{transform:translate(var(--sx,6px),var(--sy,4px))}30%{transform:translate(calc(var(--sx,6px)*-.8),calc(var(--sy,4px)*.6))}45%{transform:translate(calc(var(--sx,6px)*.6),calc(var(--sy,4px)*-.7))}60%{transform:translate(calc(var(--sx,6px)*-.4),calc(var(--sy,4px)*.4))}80%{transform:translate(calc(var(--sx,6px)*.2),0)}100%{transform:translate(0,0)}}
@keyframes akFlash{0%{opacity:var(--fo,.4)}100%{opacity:0}}
#stage.shake{animation:akShake var(--dur,320ms) ease-out}
#flash.go{animation:akFlash 380ms ease-out}
@media (prefers-reduced-motion: reduce){ #stage.shake,#flash.go{animation:none} }
canvas{display:block; background:var(--board); border-radius:18px; touch-action:manipulation; cursor:pointer}
#wrap.tooling canvas{outline:3px solid var(--accent); outline-offset:-3px}
#overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(10,18,24,.45); border-radius:18px; line-height:1.3}
#overlay .card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px 22px; text-align:center; max-width:280px; display:flex; flex-direction:column; gap:10px; align-items:center}
#overlay h2{font-family:var(--display); font-weight:600; font-size:1.4rem; margin:0}
#overlay p{margin:0; color:var(--muted); font-size:.92rem}

.hint{color:var(--muted); font-size:.85rem; min-height:1.3em}
.meter{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.8rem; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:9px 12px}
.meter b{font-weight:700; color:var(--fg)}
.pips{display:flex; gap:7px}
.pips i{--p:var(--accent); width:18px; height:18px; border-radius:50%; border:2px solid color-mix(in srgb,var(--p) 45%,var(--line)); display:block; transition:background .2s, border-color .2s, transform .2s}
.pips i:nth-child(1){--p:#E8735A}
.pips i:nth-child(2){--p:#F0B445}
.pips i:nth-child(3){--p:#5FB383}
.pips i:nth-child(4){--p:#529CD6}
.pips i.on{background:var(--p); border-color:var(--p); transform:scale(1.08)}
.meter.full{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.meter.full .pips i.on{animation:pipPulse 1.1s ease-in-out infinite}
.meter.full .pips i:nth-child(2).on{animation-delay:.15s}
.meter.full .pips i:nth-child(3).on{animation-delay:.3s}
.meter.full .pips i:nth-child(4).on{animation-delay:.45s}
@keyframes pipPulse{0%,100%{transform:scale(1.08)}50%{transform:scale(1.3)}}
@media (prefers-reduced-motion: reduce){ .meter.full .pips i.on{animation:none} .pips i,.track i{transition:none} }
.bar{display:flex; gap:8px; flex-wrap:wrap}
button{
  font:700 .85rem var(--body); color:var(--fg); background:var(--panel); border:1px solid var(--line);
  border-radius:999px; padding:8px 14px; cursor:pointer;
}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button:active{transform:scale(.97)}
button:disabled{opacity:.45; cursor:default}
button.on{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}

.bar{align-items:center}
.tool{position:relative; width:44px; height:44px; padding:0; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; color:var(--t); border-color:color-mix(in srgb,var(--t) 50%,var(--line)); background:color-mix(in srgb,var(--t) 14%,var(--panel))}
.tool.util{--t:var(--muted); color:var(--fg); background:var(--panel); border-color:var(--line)}
.tool.util:hover{border-color:var(--muted)}
.tool.util[data-tip]::after{left:auto; right:0; max-width:190px}
.tool.util.on{background:var(--fg); color:var(--bg); border-color:var(--fg); box-shadow:none}
#swap{--t:var(--t-swap)}
#paint{--t:var(--t-paint)}
#rewind{--t:var(--t-rewind)}
#clear{--t:var(--t-clear)}
.tool:hover{border-color:var(--t)}
.tool.fresh{animation:fresh 1.6s ease-in-out infinite}
@keyframes fresh{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--t) 45%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--t) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.tool.fresh{animation:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--t) 40%,transparent)}}
.tool.on{background:var(--t); color:#fff; border-color:var(--t); box-shadow:0 0 0 3px color-mix(in srgb,var(--t) 30%,transparent)}
.tool.on .count{background:var(--fg); color:var(--bg)}
.tool svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.tool .count{position:absolute; top:-5px; right:-5px; min-width:20px; height:20px; padding:0 5px; border-radius:99px; background:var(--t,var(--accent)); color:#fff; font:700 .72rem var(--body); display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums}
.tool:disabled .count{background:var(--muted)}
.tool[data-tip]::after{
  content:attr(data-tip); position:absolute; left:0; bottom:calc(100% + 10px); width:max-content; max-width:220px;
  background:var(--fg); color:var(--bg); font:600 .78rem/1.35 var(--body); text-align:left; white-space:normal;
  padding:7px 10px; border-radius:10px; opacity:0; pointer-events:none; transform:translateY(4px);
  transition:opacity .15s, transform .15s; z-index:5;
}
.tool:focus-visible::after{opacity:1; transform:none}
@media (hover:hover){ .tool:hover::after{opacity:1; transform:none} }

.st span{color:var(--line)}
.st span.on{color:#F0B445}
#ovStars{font-size:2rem; letter-spacing:.14em; line-height:1}
#overlay .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.howto{margin:0; padding:0; list-style:none; text-align:left; display:flex; flex-direction:column; gap:9px; font-size:.86rem; color:var(--fg)}
.howto li{line-height:1.35}
#picker{position:absolute; inset:0; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px; line-height:1.3; overflow:auto; display:flex; flex-direction:column; gap:12px}
.pickhead{display:flex; justify-content:space-between; align-items:center; gap:10px}
.pickhead h2{font-family:var(--display); font-weight:600; font-size:1.25rem; margin:0}
#pickGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:8px}
.lv{display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; border-radius:14px}
.lv b{font-family:var(--display); font-weight:500; font-size:1.15rem; line-height:1}
.lv small{font-size:.72rem; letter-spacing:.08em; min-height:1em; color:var(--muted)}
.lv.cur{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.note{grid-column:1 / -1; color:var(--muted); font-size:.8rem}

html[data-bg=meadow] body{background-image:linear-gradient(rgba(110,180,100,.2),rgba(110,180,100,.2))}
html[data-bg=shore] body{background-image:linear-gradient(rgba(80,170,190,.2),rgba(80,170,190,.2))}
html[data-bg=dusk] body{background-image:linear-gradient(rgba(140,100,190,.2),rgba(140,100,190,.2))}
html[data-bg=blossom] body{background-image:linear-gradient(rgba(230,130,160,.2),rgba(230,130,160,.2))}
#ovBody a{color:var(--accent); font-weight:700}
.st span.on{animation:starpop .5s cubic-bezier(.2,1.4,.4,1) both}
.st span:nth-child(2).on{animation-delay:.15s}
.st span:nth-child(3).on{animation-delay:.3s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
#overlay .card{animation:cardin .35s ease both}
@keyframes cardin{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.st span.on,#overlay .card{animation:none}}
.modes button.todo::after{content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-left:6px; vertical-align:middle}
.wh{grid-column:1 / -1; font-family:var(--display); font-weight:500; margin-top:6px; display:flex; justify-content:space-between; gap:8px; font-size:.95rem}
.wh small{color:var(--muted); font-family:var(--body); font-size:.78rem}
#settings button.danger{border-color:#C0463C; color:#C0463C}
#settings input[type=range]{width:120px; accent-color:var(--accent); justify-self:end}

#settings{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:grid; grid-template-columns:1fr auto; gap:10px 12px; align-items:center}
#settings label{font-weight:600; font-size:.88rem}
select{font:600 .85rem var(--body); color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:6px 8px; max-width:100%}
#settings input[type=checkbox]{width:20px; height:20px; accent-color:var(--accent); justify-self:end}
.swatches{display:flex; gap:5px; grid-column:1 / -1}
.swatches i{width:22px; height:22px; border-radius:7px; display:block}
</style>

<div class="col">
  <header>
    <h1><a href="/" aria-label="Akkato home page" style="color:inherit;text-decoration:none">Akkato</a></h1>
    <div class="scores">
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span id="lab2">Level</span><b id="stat2">1</b></div>
    </div>
  </header>

  <div class="modes" role="group" aria-label="Mode">
    <button id="mLevels" type="button" aria-pressed="true">Levels</button>
    <button id="mEndless" type="button" aria-pressed="false">Endless</button>
    <button id="mDaily" type="button" aria-pressed="false">Daily</button>
  </div>

  <div class="status">
    <div class="goalbox">
      <div class="goaltext" id="goaltext">Reach 600 points</div>
      <div class="track"><i id="fill"></i></div>
    </div>
    <div class="chip" id="movesChip"><span id="movesLab">Moves</span><b id="moves">18</b></div>
    <div class="chip" id="swapChip"><span>Swaps</span><b id="swaps">3</b></div>
  </div>

  <div id="wrap">
    <div id="stage">
      <canvas id="board" aria-label="Game board. Tap groups of two or more matching blocks to pop them."></canvas>
      <div id="flash" aria-hidden="true"></div>
      <div id="overlay" hidden><div class="card"><h2 id="ovTitle"></h2><div id="ovStars" class="st" hidden></div><p id="ovBody"></p><div class="row"><button id="ovBtn" type="button" class="primary">Continue</button><button id="ovBtn2" type="button" hidden>Replay</button></div></div></div>
      <div id="picker" hidden><div class="pickhead"><h2>Choose a level</h2><button id="pickClose" type="button">Close</button></div><div id="pickGrid"></div></div>
    </div>
  </div>

  <div class="hint" id="hint" aria-live="polite"></div>

  <div class="meter" id="meterBox" aria-label="Combo meter">
    <b>Combo meter</b>
    <div class="pips" id="pips"></div>
    <span id="meterNote">Pop 5 or more at once to charge it</span>
  </div>

  <div class="bar">
    <button id="swap" class="tool" type="button" data-tip="Swap: trade two neighboring blocks. Does not use a move." aria-label="Swap, 3 left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg><span class="count" id="swapCount">3</span></button>
    <button id="paint" class="tool" type="button" data-tip="Paint: tap a block and 7 blocks around it take its color. Pop them to make a bomb." aria-label="Paint, 1 left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg><span class="count" id="paintCount">1</span></button>
    <button id="clear" class="tool" type="button" data-tip="Color Clear: tap a block and every block of that color is removed. Does not use a move. Earn it from the combo meter." aria-label="Color Clear, 0 left"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span class="count" id="clearCount">0</span></button>
    <button id="rewind" class="tool" type="button" data-tip="Rewind: undo your last move and get the moves back." aria-label="Rewind, 2 left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="count" id="rewindCount">2</span></button>
    <button id="shuffle" class="tool util" type="button" data-tip="Shuffle: mix the colors on the board. Free, and does not use a move." aria-label="Shuffle the board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button id="reset" class="tool util" type="button" data-tip="Restart level" aria-label="Restart level"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button id="levelsBtn" class="tool util" type="button" data-tip="Level select: pick a level and see your stars." aria-label="Level select"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg></button>
    <button id="settingsBtn" class="tool util" type="button" data-tip="Settings: colors, hints, theme and sound." aria-label="Settings" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.6"/><circle cx="9" cy="17" r="2.6"/></svg></button>
  </div>

  <div id="settings" hidden>
    <label for="palette">Block colors</label>
    <select id="palette">
      <option value="default">Default</option>
      <option value="cb">Color-blind friendly</option>
      <option value="hc">High contrast</option>
    </select>
    <div class="swatches" id="swatches" aria-hidden="true"></div>
    <label for="bigshapes">Larger shapes on blocks</label>
    <input id="bigshapes" type="checkbox">
    <label for="hintsel">Show a hint after a pause</label>
    <select id="hintsel">
      <option value="off">Off</option>
      <option value="6">After 6 seconds</option>
      <option value="10">After 10 seconds</option>
    </select>
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="auto">Match my device</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <label for="soundbox">Sound effects</label>
    <input id="soundbox" type="checkbox" checked>
    <label for="musicbox">Soft background music</label>
    <input id="musicbox" type="checkbox" checked>
    <label for="volrange">Volume</label>
    <input id="volrange" type="range" min="0" max="100" step="5" value="60" aria-label="Volume">
    <label for="hapticbox">Vibration on pops and blasts</label>
    <input id="hapticbox" type="checkbox" checked>
    <label for="bgsel">Background</label>
    <select id="bgsel"></select>
    <div class="note" id="starNote"></div>
    <label for="challengebox">Endless challenge: a block freezes every few moves</label>
    <input id="challengebox" type="checkbox">
    <label for="howBtn">How to play</label>
    <button id="howBtn" type="button">Show</button>
    <label for="credBtn">About, credits and privacy</label>
    <button id="credBtn" type="button">Show</button>
    <label for="resetAll">Erase all progress</label>
    <button id="resetAll" type="button" class="danger">Reset</button>
    <div class="note">Plays offline with no ads. Your progress is saved on this device.</div>
    <div class="note" id="verNote">Akkato <span id="verNum"></span></div>
  </div>
</div>

<script>
(function(){
  var COLS=8, ROWS=10;
  var METER_MAX=4, POWER_CAP=3, PAINT_SIZE=7;
  /* Tools arrive one at a time in Levels. Endless has them all. */
  var UNLOCK={swap:3,rewind:5,paint:7,clear:12};
  function toolOn(t){ return mode!=='levels' || level>=UNLOCK[t]; }
  var PALETTES={
    'default':['#E8735A','#529CD6','#5FB383','#F0B445','#A488D4'],
    'cb':['#D55E00','#56B4E9','#009E73','#F0E442','#CC79A7'],
    'hc':['#C62828','#0D47A1','#1B5E20','#FFC107','#6A1B9A']
  };
  var SHAPE_CHARS=['●','◆','▲','■','◎'];
  var SHAPE_NAMES=['circle','diamond','triangle','square','ring'];
  var NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99];

  var cv=document.getElementById('board'), ctx=cv.getContext('2d');
  var $=function(id){return document.getElementById(id)};
  var elScore=$('score'), elStat2=$('stat2'), elLab2=$('lab2'), elHint=$('hint');
  var cell=40, W=0, H=0, dpr=1;
  var grid=[], parts=[], score=0, best=0, moving=false, needCheck=false, hintT=0, frame=0;
  var mode='levels', level=1, maxLevel=1, ncolors=3, movesLeft=18, goal=null, collected=0;

  /* ---------- level definitions ---------- */
  /* Levels are tuned to feel unhurried: every pop is worth less (levelPts grows slowly with group size,
     so one huge group cannot win a level) and there are more moves. Raise or lower the targets in
     levelDef to make levels harder or easier. */
  var LV_SCALE=0.4;
  function scaled(v){ return lvl() ? Math.max(1,Math.round(v*LV_SCALE)) : v; }
  function blastSize(chain){ return chain>=3?7:5; }

  function levelDef(n){
    var ncol=n<3?3:(n<7?4:5);
    var moves=Math.min(40,30+Math.floor(n/2));
    if(n>30) moves=Math.max(34,moves-Math.floor((n-30)/6));
    var late=Math.max(0,n-25);
    if(n%2===1){
      /* Targets were set from bot playthroughs: more colors means smaller groups, so lower point goals. */
      var target=ncol===3?650:(ncol===4?450+20*(n-3):Math.min(520,300+12*(n-7)));
      if(late) target+=3*late;
      return {ncol:ncol,moves:moves,type:'score',target:target};
    }
    /* Collect goals: with 5 colors a single color is rarer, so the goal is about 30% smaller. */
    var ct=Math.round((12+3*n)*1.3);
    ct=ncol===5?Math.min(40,Math.round(ct*0.7)):Math.min(70,ct);
    return {ncol:ncol,moves:moves+2,type:'collect',color:(n/2-1)%ncol,target:ct};
  }

  /* ---------- worlds, stars, backgrounds, daily challenge ---------- */
  var WORLDS=[

  var BGS=[{k:'default',name:'Sky',at:0},{k:'meadow',name:'Meadow',at:12},{k:'shore',name:'Shoreline',at:30},{k:'dusk',name:'Dusk',at:55},{k:'blossom',name:'Blossom',at:85}];

  }
  function unlockNote(before){

  function dateKey(){

  /* ---------- grid ---------- */
  function newBlock(){return {c:rnd(ncolors),bomb:false,ice:false,y:0,vy:0,s:1,ox:0,oy:0}}

  function fillBoard(){
    grid=[];
    for(var c=0;c<COLS;c++){
      grid[c]=[];
      for(var r=0;r<ROWS;r++){
        var b=newBlock();
        b.y=r-ROWS-2-c*0.35;
        grid[c][r]=b;
      }
    }
    if(iceToPlace>0){ freezeRandom(iceToPlace); iceToPlace=0; }
    parts=[]; moving=true; needCheck=false; sel=null; hintMove=null; idleT=0;
    if(!hasMoves()) reshuffleColors();
  }

  /* Frozen (ice) blocks cannot be tapped or matched. Popping a group next to one thaws it. */
  function freezeRandom(k){
    var pool=[];
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){ var b=grid[c]&&grid[c][r]; if(b&&!b.bomb&&!b.ice) pool.push(b); }
    for(var i=0;i<k&&pool.length;i++){
      var j=rnd(pool.length), blk=pool.splice(j,1)[0];
      blk.ice=true; blk.s=1.25;

  }
  function thawAround(cells){
    var n=0;
    for(var i=0;i<cells.length;i++){
      var nb=[[cells[i][0]+1,cells[i][1]],[cells[i][0]-1,cells[i][1]],[cells[i][0],cells[i][1]+1],[cells[i][0],cells[i][1]-1]];
      for(var j=0;j<4;j++){
        var x=nb[j][0], y=nb[j][1];
        if(x<0||y<0||x>=COLS||y>=ROWS) continue;
        var o=grid[x][y];
        if(o&&o.ice){ o.ice=false; o.s=1.3; burst(x,y,o.c,5); n++; }
      }
    }
    if(n>0){ tone(880,0.12,0.08); tone(1175,0.12,0.06); }

  }

  function compact(){
    for(var c=0;c<COLS;c++){
      var col=[];
      for(var r=ROWS-1;r>=0;r--) if(grid[c][r]) col.push(grid[c][r]);
      var missing=ROWS-col.length, nc=[];
      for(var i=0;i<ROWS;i++) nc[i]=null;
      for(var i2=0;i2<col.length;i2++) nc[ROWS-1-i2]=col[i2];
      for(var k=0;k<missing;k++){
        var b=newBlock(); b.y=-(k+1);
        nc[missing-1-k]=b;
      }
      grid[c]=nc;
    }

  }

  function cluster(c,r){
    var b=grid[c][r]; if(!b||b.bomb||b.ice) return [];
    var seen={}, out=[], stack=[[c,r]];
    seen[c+','+r]=1;
    while(stack.length){
      var p=stack.pop(), x=p[0], y=p[1];
      out.push(p);
      var nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
      for(var i=0;i<4;i++){
        var nx=nb[i][0], ny=nb[i][1];
        if(nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
        var k=nx+','+ny;
        if(seen[k]) continue;
        var o=grid[nx][ny];
        if(o&&!o.bomb&&!o.ice&&o.c===b.c){seen[k]=1; stack.push([nx,ny]);}
      }
    }
    return out;
  }

  function hasMoves(){
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){

      if(b.bomb) return true;

      if(c+1<COLS&&grid[c+1][r]&&!grid[c+1][r].bomb&&!grid[c+1][r].ice&&grid[c+1][r].c===b.c) return true;
      if(r+1<ROWS&&grid[c][r+1]&&!grid[c][r+1].bomb&&!grid[c][r+1].ice&&grid[c][r+1].c===b.c) return true;
    }
    return false;
  }

  function reshuffleColors(){
    var list=[];
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++) if(grid[c][r]&&!grid[c][r].bomb&&!grid[c][r].ice) list.push(grid[c][r]);
    for(var t=0;t<30;t++){
      var cols=list.map(function(b){return b.c});
      for(var i=cols.length-1;i>0;i--){var j=rnd(i+1),tmp=cols[i];cols[i]=cols[j];cols[j]=tmp;}
      for(var k=0;k<list.length;k++){list[k].c=cols[k]; list[k].s=1.3;}
      if(hasMoves()) break;
    }
    hintMove=null;
  }

  /* ---------- smart hint ---------- */
  // Simulated board: m[c][r] = -1 empty, 0..4 color, 100 bomb. Gravity only, no refill.
  function snapshot(){
    var m=[];
    for(var c=0;c<COLS;c++){ m[c]=[]; for(var r=0;r<ROWS;r++){ var b=grid[c][r]; m[c][r]=!b?-1:(b.bomb?100:(b.ice?150:b.c)); } }
    return m;
  }
  function gravity(m){
    for(var c=0;c<COLS;c++){
      var col=[]; for(var r=ROWS-1;r>=0;r--) if(m[c][r]!==-1) col.push(m[c][r]);
      for(var r2=0;r2<ROWS;r2++) m[c][ROWS-1-r2]=r2<col.length?col[r2]:-1;
    }
  }
  function maxGroup(m){
    var seen={}, best=0;
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){
      var v=m[c][r]; if(v<0||v>=100||seen[c+','+r]) continue;
      var n=0, st=[[c,r]]; seen[c+','+r]=1;
      while(st.length){
        var p=st.pop(); n++;
        var nb=[[p[0]+1,p[1]],[p[0]-1,p[1]],[p[0],p[1]+1],[p[0],p[1]-1]];
        for(var i=0;i<4;i++){
          var x=nb[i][0], y=nb[i][1];
          if(x<0||y<0||x>=COLS||y>=ROWS||seen[x+','+y]) continue;
          if(m[x][y]===v){seen[x+','+y]=1; st.push([x,y]);}
        }
      }
      if(n>best) best=n;
    }
    return best;
  }
  function popValue(n,colorIdx){
    var v=n*(n-1)*5;
    if(lvl()&&goal&&goal.type==='collect'){
      v=(colorIdx===goal.color)?(n*40+n*(n-1)*2):(n*(n-1));
    }
    if(n>=7) v+=90;
    return v;
  }
  function findBestMove(){
    var seen={}, bestM=null;
    var collect=(lvl()&&goal&&goal.type==='collect');
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){
      var b=grid[c][r]; if(!b||seen[c+','+r]) continue;
      var cand=null;
      if(b.bomb){
        var done={}, queue=[[c,r]], chain=0, val=0, cells=[], tgt=0, cellSeen={};
        while(queue.length){
          var p=queue.shift(), k=p[0]+','+p[1];
          if(done[k]) continue; done[k]=1; chain++;
          var cnt=0;
          var hsz=blastSize(chain), hhalf=(hsz-1)/2;
          var wx=Math.max(0,Math.min(COLS-hsz,p[0]-hhalf)), wy=Math.max(0,Math.min(ROWS-hsz,p[1]-hhalf));
          for(var dx=0;dx<hsz;dx++) for(var dy=0;dy<hsz;dy++){
            var x=wx+dx, y=wy+dy;
            if(x<0||y<0||x>=COLS||y>=ROWS) continue;
            var o=grid[x][y]; if(!o) continue;
            if(o.bomb&&!done[x+','+y]) queue.push([x,y]);
            if(!cellSeen[x+','+y]){ cellSeen[x+','+y]=1; cells.push([x,y]); cnt++; if(collect&&o.c===goal.color) tgt++; }
          }
          val+=cnt*12*chain;
        }
        if(collect) val=tgt*40+cells.length*3;
        cand={cells:cells,value:val,label:chain>1?('Bomb chain x'+chain+' clears the most here.'):'This bomb clears the most right now.'};
      } else {
        var grp=cluster(c,r);
        for(var i=0;i<grp.length;i++) seen[grp[i][0]+','+grp[i][1]]=1;
        if(grp.length<2) continue;
        var n=grp.length, m=snapshot();
        for(var j=0;j<grp.length;j++) m[grp[j][0]][grp[j][1]]=-1;
        gravity(m);
        var follow=maxGroup(m);
        var fv=follow>=2?follow*(follow-1)*5:0;
        var v=popValue(n,b.c)+fv*(collect?0.2:0.35);
        var lab;
        if(n>=7) lab='This group makes a bomb, and leaves a good follow-up.';
        else if(collect&&b.c===goal.color) lab='Collects '+n+' '+SHAPE_NAMES[b.c]+' blocks and sets up more.';
        else lab='Best payoff: '+n+' blocks, and it leaves a bigger group behind.';
        cand={cells:grp,value:v,label:lab};
      }
      if(cand&&(!bestM||cand.value>bestM.value)) bestM=cand;
    }
    return bestM;
  }

  /* ---------- effects ---------- */
  function burst(c,r,colIdx,n){
    var cx=(c+0.5)*cell, cy=(r+0.5)*cell;
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2, sp=(0.6+Math.random()*1.6)*cell;
      parts.push({k:'dot',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-cell*0.5,life:0.55+Math.random()*0.25,age:0,col:colIdx,size:cell*(0.06+Math.random()*0.07)});
    }
  }

        var b=newBlock(); b.c=v%10; b.bomb=(v%20)>=10; b.ice=(v>=20&&!b.bomb); b.y=r; grid[c][r]=b;

  function blastFx(c0,r0,chain){

      if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var st=$('stage'), fl=$('flash'); if(!st||!fl) return;
      var amp=Math.min(14,4+chain*2.5), dur=Math.min(520,260+chain*50);
      st.style.setProperty('--sx',amp+'px'); st.style.setProperty('--sy',(amp*0.7)+'px'); st.style.setProperty('--dur',dur+'ms');
      fl.style.setProperty('--fo',Math.min(0.55,0.28+chain*0.06));
      fl.style.background='radial-gradient(circle at '+((c0+0.5)/COLS*100)+'% '+((r0+0.5)/ROWS*100)+'%, rgba(255,250,225,.95), rgba(255,196,110,.6) 30%, rgba(255,150,80,0) 65%)';
      st.classList.remove('shake'); fl.classList.remove('go'); void st.offsetWidth;
      st.classList.add('shake'); fl.classList.add('go');
    }catch(e){}
  }

  function explode(c0,r0){
    takeSnap();
    var queue=[[c0,r0]], done={}, chain=0, pts=0;
    while(queue.length){
      var p=queue.shift(), k=p[0]+','+p[1];
      if(done[k]) continue; done[k]=1;
      chain++;
      var cnt=0;
      /* A blast reaches 2 blocks out (5x5). From the third bomb in a chain it reaches 3 out (7x7). */
      var sz=blastSize(chain), half=(sz-1)/2;
      var wx=Math.max(0,Math.min(COLS-sz,p[0]-half)), wy=Math.max(0,Math.min(ROWS-sz,p[1]-half));
      for(var dx=0;dx<sz;dx++) for(var dy=0;dy<sz;dy++){
        var x=wx+dx, y=wy+dy;
        if(x<0||y<0||x>=COLS||y>=ROWS) continue;
        var b=grid[x][y]; if(!b) continue;
        if(b.bomb&&!done[x+','+y]) queue.push([x,y]);
        remove(x,y,Math.min(16,6+2*chain)); cnt++;
      }
      pts+=cnt*12*chain;
    }
    pts=scaled(pts);
    addScore(pts);
    blastFx(c0,r0,chain);
    floatText((c0+0.5)*cell,(r0+0.5)*cell,'+'+pts);
    if(chain>1){
      floatText((c0+0.5)*cell,(r0+0.5)*cell-cell*0.7,'Chain x'+chain);
      say('Chain x'+chain+'! Linked bombs widen the blast and multiply the points.',2400);
      registerCombo();
    }
    blastSound(chain);
    if(lvl()) movesLeft--;
    endlessTurn();
    compact(); updateHUD();
  }

  function doSwap(a,b){
    var ba=grid[a.c][a.r], bb=grid[b.c][b.r];
    if(!ba||!bb) return;
    if(!ba.bomb&&!bb.bomb&&ba.c===bb.c){ sel=null; say('Those match already. Pick a different neighbor.',1800); return; }
    takeSnap();
    grid[a.c][a.r]=bb; grid[b.c][b.r]=ba;
    ba.y=b.r; bb.y=a.r;
    ba.ox=a.c-b.c; ba.oy=a.r-b.r;
    bb.ox=b.c-a.c; bb.oy=b.r-a.r;
    swapsLeft--; clearTool(); hintMove=null; idleT=0;
    tone(330,0.15,0.1); tone(392,0.15,0.08);
    elHint.textContent=defaultHint();
    updateHUD(); saveGame();
  }

  function endlessTurn(){
    if(mode!=='endless'||!challenge) return;
    endlessMoves++;
    if(endlessMoves%6===0){
      freezeRandom(1+Math.min(2,Math.floor(score/3000)));
      say('A block froze. Pop next to it to thaw it.',2600);
    }
  }

  function clearColor(c,r){
    var b=grid[c][r]; if(!b) return;
    if(b.bomb){ say('Bombs keep their place. Tap a regular block.',1800); return; }
    takeSnap();
    var col=b.c, n=0;
    for(var x=0;x<COLS;x++) for(var y=0;y<ROWS;y++){
      var o=grid[x][y];
      if(o&&!o.bomb&&o.c===col){ remove(x,y,8); n++; }
    }
    var pts=lvl()?n*4:n*12;
    addScore(pts);
    floatText((c+0.5)*cell,(r+0.5)*cell,'+'+pts);
    clearLeft--; clearTool(); hintMove=null; idleT=0;
    tone(523.25,0.2,0.12); tone(659.25,0.2,0.1); tone(880,0.3,0.1);
    blastFx(c,r,2);
    say('Color Clear! '+n+' '+SHAPE_NAMES[col]+' blocks are gone.',2600);
    compact(); updateHUD();
  }

  function paintSplash(c,r){
    var b=grid[c][r]; if(!b) return;
    if(b.bomb){ say('Bombs cannot be painted. Tap a regular block.',1800); return; }
    if(b.ice){ say('That block is frozen. Pop a group next to it first.',2000); return; }
    takeSnap();
    var region=[[c,r]], inR={}; inR[c+','+r]=1;
    while(region.length<PAINT_SIZE){
      var frontier=[];
      for(var i=0;i<region.length;i++){
        var nb=[[region[i][0]+1,region[i][1]],[region[i][0]-1,region[i][1]],[region[i][0],region[i][1]+1],[region[i][0],region[i][1]-1]];
        for(var j=0;j<4;j++){
          var x=nb[j][0], y=nb[j][1];
          if(x<0||y<0||x>=COLS||y>=ROWS||inR[x+','+y]) continue;
          var o=grid[x][y]; if(!o||o.bomb||o.ice) continue;
          frontier.push([x,y]);
        }
      }
      if(!frontier.length) break;
      var pick=frontier[rnd(frontier.length)];
      region.push(pick); inR[pick[0]+','+pick[1]]=1;
    }
    for(var k=0;k<region.length;k++){
      var blk=grid[region[k][0]][region[k][1]];
      blk.c=b.c; blk.s=1.35;
      burst(region[k][0],region[k][1],b.c,3);
    }
    paintLeft--; clearTool(); hintMove=null; idleT=0;
    tone(392,0.15,0.1); tone(523.25,0.15,0.1); tone(659.25,0.25,0.1);
    say('Splash! Tap the big group to pop it into a bomb.',3000);
    updateHUD(); saveGame();
  }

  function tap(px,py){
    if(moving||phase!=='play'||!modalClosed()) return;
    var c=Math.floor(px/cell), r=Math.floor(py/cell);
    if(c<0||r<0||c>=COLS||r>=ROWS) return;
    var b=grid[c][r]; if(!b) return;

    if(tool==='swap'){
      if(b.ice){ say('Frozen blocks cannot be swapped.',1800); return; }
      if(!sel){ sel={c:c,r:r}; tone(440,0.1,0.08); return; }
      if(sel.c===c&&sel.r===r){ sel=null; return; }
      if(Math.abs(sel.c-c)+Math.abs(sel.r-r)===1){ doSwap(sel,{c:c,r:r}); return; }
      sel={c:c,r:r}; tone(440,0.1,0.08); return;
    }
    if(tool==='paint'){ paintSplash(c,r); return; }
    if(tool==='clear'){ clearColor(c,r); return; }

    if(b.bomb){explode(c,r); return;}
    if(b.ice){
      b.s=0.88; tone(150,0.12,0.08);
      say('That block is frozen. Pop a group next to it to thaw it.',2200);
      return;
    }
    var grp=cluster(c,r);
    if(grp.length<2){
      b.s=0.82; tone(130,0.12,0.08);
      say('That one is on its own. Try a group'+(toolOn('swap')?', or use a swap.':'.'),1800);
      return;
    }
    takeSnap();
    var n=grp.length, colIdx=b.c;
    for(var i=0;i<grp.length;i++) remove(grp[i][0],grp[i][1],4);
    thawAround(grp);
    var pts=lvl()?levelPts(n):n*(n-1)*5;
    addScore(pts);
    floatText((c+0.5)*cell,(r+0.5)*cell,'+'+pts);
    popSound(n);
    if(n>=7){
      var bomb=newBlock(); bomb.c=colIdx; bomb.bomb=true; bomb.y=r; bomb.s=1.4;
      grid[c][r]=bomb;
      say('Bomb made! Tap it to clear the area around it.',2600);
    }
    if(n>=5) registerCombo();
    if(n<7) tip('pop','Nice! Bigger groups score more. Pop 7 or more to make a bomb.',5000);
    if(lvl()) movesLeft--;
    endlessTurn();
    compact(); updateHUD();
  }

  /* ---------- layout ---------- */
  function layout(){
    var wrap=$('wrap');
    var w=wrap.clientWidth||320;
    var top=wrap.getBoundingClientRect().top+window.scrollY;
    var availH=window.innerHeight-top-170;
    cell=Math.max(26,Math.floor(Math.min(w/COLS,availH/ROWS)));
    W=cell*COLS; H=cell*ROWS;
    dpr=Math.min(window.devicePixelRatio||1,3);
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cv.style.width=W+'px'; cv.style.height=H+'px';
  }

  /* ---------- drawing ---------- */
  function rr(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function glyph(kind,cx,cy,u){
    ctx.beginPath();
    if(kind===0){ctx.arc(cx,cy,u,0,Math.PI*2);}
    else if(kind===1){ctx.moveTo(cx,cy-u*1.2);ctx.lineTo(cx+u*1.1,cy);ctx.lineTo(cx,cy+u*1.2);ctx.lineTo(cx-u*1.1,cy);ctx.closePath();}
    else if(kind===2){ctx.moveTo(cx,cy-u*1.05);ctx.lineTo(cx+u*1.1,cy+u*0.85);ctx.lineTo(cx-u*1.1,cy+u*0.85);ctx.closePath();}
    else if(kind===3){ctx.rect(cx-u*0.9,cy-u*0.9,u*1.8,u*1.8);}
    else {ctx.arc(cx,cy,u,0,Math.PI*2);ctx.moveTo(cx+u*0.45,cy);ctx.arc(cx,cy,u*0.45,0,Math.PI*2,true);}
    ctx.fill('evenodd');
  }

  function drawBlock(b,c){
    var cx=(c+0.5+b.ox)*cell, cy=(b.y+0.5+b.oy)*cell;
    var size=(cell-cell*0.12)*b.s, x=cx-size/2, y=cy-size/2;
    var base=colors[b.c]||'#888';
    var dark=lum(base)>0.62;
    var ink=dark?'rgba(20,28,34,0.82)':'rgba(255,255,255,0.88)';
    ctx.fillStyle=base;
    rr(x,y,size,size,cell*0.24*b.s); ctx.fill();
    if(paletteKey==='hc'){ ctx.lineWidth=Math.max(2,cell*0.05); ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.stroke(); }
    ctx.fillStyle='rgba(255,255,255,0.16)';
    rr(x+size*0.08,y+size*0.06,size*0.84,size*0.36,cell*0.16*b.s); ctx.fill();
    ctx.fillStyle=ink; ctx.strokeStyle=ink;
    if(b.bomb){
      var pulse=1+Math.sin(frame*0.08)*0.08;
      ctx.lineWidth=cell*0.07;
      ctx.beginPath(); ctx.arc(cx,cy,size*0.27*pulse,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,size*0.09,0,Math.PI*2); ctx.fill();
      for(var i=0;i<4;i++){
        var a=i*Math.PI/2+Math.PI/4;
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*size*0.34*pulse,cy+Math.sin(a)*size*0.34*pulse);
        ctx.lineTo(cx+Math.cos(a)*size*0.42*pulse,cy+Math.sin(a)*size*0.42*pulse); ctx.stroke();
      }
    } else {
      glyph(b.c,cx,cy+size*0.03,size*(bigShapes?0.27:0.16));
    }
    if(b.ice){
      ctx.fillStyle='rgba(222,241,255,0.55)';
      rr(x,y,size,size,cell*0.24*b.s); ctx.fill();
      ctx.lineWidth=Math.max(2,cell*0.06); ctx.strokeStyle='rgba(150,195,232,0.95)';
      rr(x+ctx.lineWidth/2,y+ctx.lineWidth/2,size-ctx.lineWidth,size-ctx.lineWidth,cell*0.22*b.s); ctx.stroke();
      ctx.lineWidth=Math.max(1.5,cell*0.04); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(x+size*0.16,y+size*0.34); ctx.lineTo(x+size*0.34,y+size*0.16);
      ctx.moveTo(x+size*0.16,y+size*0.5); ctx.lineTo(x+size*0.5,y+size*0.16);
      ctx.moveTo(x+size*0.66,y+size*0.84); ctx.lineTo(x+size*0.84,y+size*0.66);
      ctx.stroke();
    }
  }

  function drawBombLinks(){
    var nbrs=[[1,0],[0,1],[1,1],[1,-1]];
    ctx.lineCap='round';
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){
      var a=grid[c]&&grid[c][r];
      if(!a||!a.bomb||a.y!==r) continue;
      for(var i=0;i<nbrs.length;i++){
        var nc=c+nbrs[i][0], nr=r+nbrs[i][1];
        if(nc<0||nr<0||nc>=COLS||nr>=ROWS) continue;
        var o=grid[nc][nr];
        if(!o||!o.bomb||o.y!==nr) continue;
        var x1=(c+0.5)*cell, y1=(r+0.5)*cell, x2=(nc+0.5)*cell, y2=(nr+0.5)*cell;
        ctx.lineWidth=cell*0.2; ctx.strokeStyle=boardCol;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.lineWidth=cell*0.1; ctx.strokeStyle='#FFD34D';
        ctx.globalAlpha=0.7+0.3*Math.sin(frame*0.1);
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.globalAlpha=1;
      }
    }
  }

  function drawHint(){
    if(!hintMove) return;
    var a=0.55+0.45*Math.sin(frame*0.12);
    ctx.lineWidth=Math.max(2.5,cell*0.07);
    ctx.strokeStyle='#FFD34D'; ctx.globalAlpha=a;
    for(var i=0;i<hintMove.cells.length;i++){
      var p=hintMove.cells[i];
      rr((p[0]+0.05)*cell,(p[1]+0.05)*cell,cell*0.9,cell*0.9,cell*0.27); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){
      var b=grid[c]&&grid[c][r];
      if(b&&b.y>-1) drawBlock(b,c);
    }
    drawBombLinks();
    drawHint();
    if(sel){
      ctx.lineWidth=Math.max(3,cell*0.08); ctx.strokeStyle=fgCol;
      rr((sel.c+0.06)*cell,(sel.r+0.06)*cell,cell*0.88,cell*0.88,cell*0.26); ctx.stroke();
    }
    for(var i=0;i<parts.length;i++){
      var p=parts[i], t=p.age/p.life;
      if(p.k==='dot'){
        ctx.globalAlpha=Math.max(0,1-t);
        ctx.fillStyle=colors[p.col]||'#888';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1-t*0.5),0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
      } else {
        ctx.globalAlpha=Math.max(0,1-t*t);
        ctx.fillStyle='#fff';
        ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=cell*0.08; ctx.lineJoin='round';
        ctx.font='600 '+Math.round(cell*0.42)+'px Fredoka, sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        var ty=p.y-t*cell*0.9;
        ctx.strokeText(p.txt,p.x,ty); ctx.fillText(p.txt,p.x,ty);
        ctx.globalAlpha=1;
      }
    }
  }

  /* ---------- loop ---------- */
  var last=performance.now();
  function tick(now){
    var dt=Math.min(0.05,(now-last)/1000); last=now; frame++;
    if(frame%40===0) readTheme();
    var any=false;
    for(var c=0;c<COLS;c++) for(var r=0;r<ROWS;r++){
      var b=grid[c]&&grid[c][r]; if(!b) continue;
      if(b.y<r){
        b.vy+=70*dt; b.y+=b.vy*dt; any=true;
        if(b.y>=r){b.y=r; b.vy=0; b.s=0.88;}
      }
      b.s+=(1-b.s)*Math.min(1,dt*14);
      if(b.ox||b.oy){
        var k=Math.min(1,dt*14);
        b.ox-=b.ox*k; b.oy-=b.oy*k;
        if(Math.abs(b.ox)<0.002) b.ox=0;
        if(Math.abs(b.oy)<0.002) b.oy=0;
      }
    }
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i]; p.age+=dt;
      if(p.k==='dot'){p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=cell*6*dt;}
      if(p.age>=p.life) parts.splice(i,1);
    }
    if(moving&&!any){
      moving=false;
      if(needCheck){
        needCheck=false;
        checkEnd();
        if(phase==='play'&&!hasMoves()){say('No groups left. Mixing the board.',2200); reshuffleColors();}
        saveGame();
      }
    }
    if(hintT>0){hintT-=dt*1000; if(hintT<=0) elHint.textContent=defaultHint();}

    // idle hint: best move glows after a pause
    if(hintDelay>0&&phase==='play'&&!moving&&tool===null&&modalClosed()){
      idleT+=dt;
      if(idleT>=hintDelay&&!hintMove){
        hintMove=findBestMove();
        if(hintMove){ say(hintMove.label,6000); }
      }
    } else if(moving||phase!=='play'){ idleT=0; }
    render();
    requestAnimationFrame(tick);
  }

    soundOn=this.checked; safeSet('eb-sound',soundOn?'on':'off');

  });
  window.addEventListener('resize',layout);

  /* ---------- boot ---------- */
  $('palette').value=paletteKey;
  $('bigshapes').checked=bigShapes;
  $('theme').value=savedTheme;
  $('soundbox').checked=soundOn;
  $('musicbox').checked=musicOn;
  $('volrange').value=String(Math.round(volume*100));
  $('hapticbox').checked=hapticOn;
  buildBgSelect();
  $('challengebox').checked=challenge;
  $('hintsel').value=hintDelay===0?'off':String(hintDelay);
  applyTheme(savedTheme);
  buildPips();
  applyPalette(); readTheme(); layout();
  enter(mode);
  if(!tutDone) showIntro();
  requestAnimationFrame(tick);
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
