name: Bundle game fonts

# Run this once by hand (Actions tab, Run workflow). It downloads the two open-source fonts
# the game uses and saves them inside play/fonts so the web version works fully offline.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download fonts
        run: |
          mkdir -p "$RUNNER_TEMP/f"
          cd "$RUNNER_TEMP/f"
          npm init -y >/dev/null
          npm install @fontsource/fredoka @fontsource/nunito

      - name: Copy fonts into play/fonts
        run: |
          node - <<'NODE'
          const fs = require('fs'), path = require('path');
          const nm = path.join(process.env.RUNNER_TEMP, 'f', 'node_modules', '@fontsource');
          const fonts = [
            { pkg: 'fredoka', family: 'Fredoka', weights: [400, 500, 600] },
            { pkg: 'nunito', family: 'Nunito', weights: [400, 600, 700] },
          ];
          fs.mkdirSync('play/fonts', { recursive: true });
          let css = '/* Generated by the Bundle game fonts workflow. */\n';
          for (const f of fonts) {
            for (const w of f.weights) {
              const file = `${f.pkg}-latin-${w}-normal.woff2`;
              fs.copyFileSync(path.join(nm, f.pkg, 'files', file), path.join('play/fonts', file));
              css += `@font-face{font-family:'${f.family}';font-style:normal;font-weight:${w};font-display:swap;src:url('fonts/${file}') format('woff2')}\n`;
            }
            fs.copyFileSync(path.join(nm, f.pkg, 'LICENSE'), path.join('play/fonts', `LICENSE-${f.pkg}.txt`));
          }
          fs.writeFileSync('play/fonts.css', css);
          NODE

      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/fonts play/fonts.css
          git diff --cached --quiet || (git commit -m "Add bundled fonts for the web version" && git push)
